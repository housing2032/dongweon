<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fixed Image Viewer</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

#wrap{
    width:100%;
    height:100%;
    background:#000;
}

#image{
    width:100%;
    height:100%;
    object-fit:fill;
    opacity:0;
    display:block;
}

</style>
</head>
<body>

<div id="wrap">
    <img id="image" src="">
</div>

<script>

const params =
    new URLSearchParams(location.search);

const imageFile =
    params.get("img") || "";

const img =
    document.getElementById("image");

img.onload = () => {

    img.style.transition =
        "opacity .3s ease";

    img.style.opacity = "1";
};

img.onerror = () => {

    console.error(
        "이미지 로드 실패:",
        imageFile
    );
};

img.src = imageFile;

</script>

</body>
</html>
