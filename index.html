<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>아파트 실거래 전광판</title>
<style>
:root{--bg:#101820;--panel:#182631;--panel2:#203341;--line:rgba(255,255,255,.13);--text:#f4f7f9;--muted:#a9bac5;--accent:#d9ef83}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%}
body{background:var(--bg);color:var(--text);font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;overflow:hidden}
#app{width:100vw;height:100vh;min-height:420px;display:grid;grid-template-columns:minmax(300px,42%) 1fr;gap:18px;padding:18px}
.left,.right{min-width:0;min-height:0;border:1px solid var(--line);border-radius:18px;background:var(--panel);overflow:hidden}
.left{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px}
.apt-name{width:100%;text-align:center;font-size:clamp(24px,3vw,46px);font-weight:800;letter-spacing:-1.5px;margin:0 0 18px;color:var(--accent);word-break:keep-all}
.apt-image-wrap{width:100%;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:12px;overflow:hidden}
#aptImage{display:block;width:100%;height:100%;object-fit:contain}
.image-fallback{color:#24323b;text-align:center;padding:20px;font-size:18px;line-height:1.6;white-space:pre-line}
.right{display:flex;flex-direction:column;padding:20px;background:linear-gradient(145deg,#1a2a35,#111d26)}
.right-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:0 2px 15px;margin-bottom:16px}
.right-title{font-size:clamp(23px,2.3vw,36px);font-weight:800;letter-spacing:-1px}
.area-label{color:var(--accent);font-size:clamp(15px,1.4vw,21px);white-space:nowrap;font-weight:700}
#tradeList{min-height:0;flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(112px,1fr);gap:12px;overflow:hidden}
.trade-card{min-width:0;border:1px solid rgba(255,255,255,.13);border-radius:14px;background:var(--panel2);padding:15px 17px;display:flex;flex-direction:column;justify-content:center;gap:9px;box-shadow:0 5px 18px rgba(0,0,0,.12)}
.trade-date{color:var(--muted);font-size:clamp(14px,1.2vw,18px);font-weight:600}
.trade-price{color:var(--accent);font-size:clamp(25px,2.4vw,39px);font-weight:900;letter-spacing:-1px;line-height:1.15;white-space:nowrap}
.trade-meta{display:flex;flex-wrap:wrap;gap:8px 15px;color:#e2eaf0;font-size:clamp(14px,1.15vw,17px)}
.empty{grid-column:1/-1;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:clamp(20px,2vw,30px);text-align:center;border:1px dashed var(--line);border-radius:14px}
#status{position:fixed;left:22px;bottom:8px;color:rgba(255,255,255,.5);font-size:11px;z-index:5}
@media(max-width:760px){body{overflow:auto}#app{height:100vh;min-height:600px;grid-template-columns:1fr;grid-template-rows:38% 1fr;gap:10px;padding:10px}.left{padding:10px}.apt-name{margin-bottom:8px;font-size:24px}.right{padding:13px}.right-head{padding-bottom:9px;margin-bottom:10px}#tradeList{grid-template-columns:1fr;grid-auto-rows:minmax(90px,1fr);gap:8px}.trade-card{padding:10px 13px;gap:5px}.trade-price{font-size:25px}}
</style>
</head>
<body>
<main id="app">
<section class="left">
<h1 class="apt-name" id="aptName">전광판 데이터를 불러오는 중입니다.</h1>
<div class="apt-image-wrap">
<img id="aptImage" alt="아파트 이미지" hidden>
<div class="image-fallback" id="imageFallback">데이터를 불러오고 있습니다.</div>
</div>
</section>
<section class="right">
<header class="right-head"><div class="right-title">최근 아파트 실거래</div><div class="area-label" id="areaLabel"></div></header>
<div id="tradeList"><div class="empty">구글시트 데이터를 불러오는 중입니다.</div></div>
</section>
</main>
<div id="status">초기화 중</div>
<script>
const IMAGE_BASE_PATH="./image/"; // 이미지 폴더 위치에 맞게 변경
const ROTATE_MS=5000;
let boardGroups=[],currentIndex=0,rotateTimer=null;
function setStatus(s){document.getElementById("status").textContent=s}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function imageUrl(filename){const n=String(filename||"").trim();if(!n)return"";if(/^(https?:)?\/\//i.test(n)||n.startsWith("data:"))return n;return IMAGE_BASE_PATH+encodeURIComponent(n).replace(/%2F/gi,"/")}
function renderGroup(g){
 document.getElementById("aptName").textContent=g.name;
 document.getElementById("areaLabel").textContent=g.area+"㎡";
 const img=document.getElementById("aptImage"),fb=document.getElementById("imageFallback"),src=imageUrl(g.imageFile);
 img.hidden=true;img.onerror=()=>{img.hidden=true;fb.hidden=false;fb.textContent=g.imageFile?"이미지를 찾을 수 없습니다.\n"+g.imageFile:"등록된 이미지 파일명이 없습니다."};
 img.onload=()=>{img.hidden=false;fb.hidden=true};
 if(src)img.src=src;else{img.removeAttribute("src");fb.hidden=false;fb.textContent="등록된 이미지 파일명이 없습니다."}
 const list=document.getElementById("tradeList");
 if(!g.trades.length){list.innerHTML='<div class="empty">해당 면적의 실거래 내역이 없습니다.</div>';return}
 list.innerHTML=g.trades.map(t=>`<article class="trade-card"><div class="trade-date">${esc(t.date)}</div><div class="trade-price">${esc(t.price)}</div><div class="trade-meta"><span>${esc(t.floor)}층</span><span>전용 ${esc(t.area)}㎡</span></div></article>`).join("");
}
function startRotation(){
 if(!boardGroups.length){document.getElementById("aptName").textContent="표시할 단지가 없습니다.";document.getElementById("tradeList").innerHTML='<div class="empty">단지명meta 탭의 전광판_표시여부와 나의_단지명을 확인해 주세요.</div>';setStatus("표시 대상 단지 없음");return}
 renderGroup(boardGroups[currentIndex]);setStatus(`${currentIndex+1} / ${boardGroups.length} 단지 · 5초 간격 순환`);
 if(rotateTimer)clearInterval(rotateTimer);
 rotateTimer=setInterval(()=>{currentIndex=(currentIndex+1)%boardGroups.length;renderGroup(boardGroups[currentIndex]);setStatus(`${currentIndex+1} / ${boardGroups.length} 단지 · 5초 간격 순환`)},ROTATE_MS);
}
function loadBoard(){
 if(!(window.google&&google.script&&google.script.run)){setStatus("Apps Script 웹앱에서 실행해야 합니다.");document.getElementById("tradeList").innerHTML='<div class="empty">이 HTML은 Apps Script 웹앱으로 배포한 주소에서 실행해 주세요.</div>';return}
 google.script.run.withSuccessHandler(data=>{if(!data||!data.groups)throw new Error("서버 응답 형식이 올바르지 않습니다.");boardGroups=data.groups;currentIndex=0;startRotation()})
 .withFailureHandler(e=>{setStatus("데이터 로딩 오류");document.getElementById("tradeList").innerHTML='<div class="empty">데이터를 불러오지 못했습니다.<br>'+esc(e&&e.message?e.message:e)+'</div>'})
 .getBoardData();
}
loadBoard();
</script>
</body>
</html>
