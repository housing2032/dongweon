<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>동원부동산 전광판</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

    .viewer-frame {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 999999;
      background: radial-gradient(circle at center, #181818 0%, #000000 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loading-container {
      width: 900px;
      max-width: 90%;
      text-align: center;
    }

    .loading-logo {
      width: 140px;
      height: 140px;
      margin: 0 auto 30px;
      border-radius: 35px;
      background: linear-gradient(145deg, #ff2b2b, #7d0000);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 52px;
      font-weight: 900;
      box-shadow: 0 0 50px rgba(255, 0, 0, .5);
      animation: pulse 2s infinite;
    }

    .loading-company {
      font-size: 58px;
      color: #fff;
      font-weight: 900;
    }

    .loading-company-sub {
      margin-top: 8px;
      font-size: 18px;
      letter-spacing: 6px;
      color: #888;
    }

    .loading-title {
      margin-top: 30px;
      font-size: 30px;
      color: #ffd13b;
      font-weight: 700;
    }

    .loading-line {
      width: 100%;
      height: 2px;
      margin: 35px 0;
      background: linear-gradient(90deg, transparent, #ffd13b, transparent);
    }

    .loading-status {
      width: 420px;
      margin: 0 auto;
    }

    .status-row {
      display: flex;
      align-items: center;
      color: #fff;
      font-size: 24px;
      margin: 18px 0;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #22c55e;
      margin-right: 15px;
      animation: blink 1s infinite;
    }

    .loading-message {
      font-size: 28px;
      color: #fff;
      font-weight: 700;
    }

    #loading-clock {
      margin-top: 20px;
      color: #ffd13b;
      font-size: 24px;
      font-weight: 700;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: .2; }
    }

    @media (max-width: 768px) {
      .loading-logo {
        width: 90px;
        height: 90px;
        font-size: 32px;
      }
      .loading-company {
        font-size: 28px;
      }
      .loading-company-sub {
        font-size: 12px;
        letter-spacing: 2px;
      }
      .loading-title {
        font-size: 18px;
      }
      .status-row {
        font-size: 15px;
      }
      .loading-message {
        font-size: 16px;
      }
      #loading-clock {
        font-size: 14px;
      }
      .loading-status {
        width: 100%;
      }
    }

    .active { z-index: 2; opacity: 1; }
    .hidden { z-index: 1; opacity: 0; }
  </style>
</head>
<body>

  <div id="loading-screen">
    <div class="loading-container">
      <div class="loading-logo">동원</div>
      <div class="loading-company">동원부동산</div>
      <div class="loading-company-sub">DONGWON REAL ESTATE</div>
      <div class="loading-title">실시간 매물 전광판 시스템</div>
      <div class="loading-line"></div>
      
      <div class="loading-status">
        <div class="status-row">
          <span class="status-dot"></span>
          서버 연결 확인중
        </div>
        <div class="status-row">
          <span class="status-dot"></span>
          실거래가 데이터 수신중
        </div>
        <div class="status-row">
          <span class="status-dot"></span>
          매물정보 동기화중
        </div>
      </div>
      
      <div class="loading-line"></div>
      <div class="loading-message">잠시만 기다려 주세요</div>
      <div id="loading-clock"></div>
    </div>
  </div>

  <iframe id="viewerA" class="viewer-frame active" src=""></iframe>
  <iframe id="viewerB" class="viewer-frame hidden" src=""></iframe>

  <script>
    const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR6rZBSWnFxUOBr9hjs3AWA_NQAEu4o6Zzxp_XUCfsc1n7ahE06_WVVEdiwTsplfE1EuXVSUOpo_EdU/pub?gid=1432662512&single=true&output=csv";
    const IMAGE_PAGE = "index_image.html";
    const BOARD_PAGE = "index_dashboard.html";

    let apartmentList = [];
    let currentIndex = 0;
    let currentFrame = "A"; 
    let isInitialized = false;

    function isMobile() { return window.innerWidth < 768; }
    function getImgTime() { return isMobile() ? 3000 : 5000; }
    function getBrdTime() { return isMobile() ? 3000 : 3000; }

    function parseCSV(text) {
      const lines = text.split(/\r?\n/);
      const set = new Set();
      
      for (let i = 1; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue; 
        
        let row = [];
        let insideQuote = false;
        let entries = [''];
        
        for (let j = 0; j < line.length; j++) {
          let char = line[j];
          let nextChar = line[j + 1];
          
          if (char === '"') {
            if (insideQuote && nextChar === '"') { 
              entries[entries.length - 1] += '"'; 
              j++; 
            } else { 
              insideQuote = !insideQuote; 
            }
          } else if (char === ',' && !insideQuote) {
            entries.push('');
          } else {
            entries[entries.length - 1] += char;
          }
        }
        row = entries;

        const aptName = row[1]?.trim(); 
        const useImage = row[17] ? row[17].trim().toUpperCase() : ""; 
        
        if (aptName) {
          if (useImage === "1" || useImage === "Y" || useImage === "YES" || 
             (useImage !== "N" && useImage !== "NO" && useImage !== "")) {
            set.add(aptName);
          }
        }
      }
      
      // 데이터가 정상 수신되었을 때만 전역 배열을 교체 (네트워크 다운 시 대피책)
      if (set.size > 0) {
        apartmentList = Array.from(set);
      }
    }

    // Promise 기반의 단일 프레임 제어 함수 (이벤트 리스너 누수 완벽 차단)
    function changeFrame(url, displayDuration) {
      return new Promise((resolve) => {
        const hidden = document.getElementById(currentFrame === "A" ? "viewerB" : "viewerA");
        const active = document.getElementById(currentFrame === "A" ? "viewerA" : "viewerB");
        
        hidden.src = url;

        // 5초 세이프티 제한 타이머
        const safetyTimer = setTimeout(() => {
          cleanUpAndSwitch();
        }, 5000); 

        // 보안 강화: 동일 오리진 검증 및 중복 방지 처리된 메시지 핸들러
        function onMessage(e) {
          if (e.origin !== window.location.origin) return;
          if (e.data === "datasetReady") {
            cleanUpAndSwitch();
          }
        }
        window.addEventListener("message", onMessage);

        function cleanUpAndSwitch() {
          window.removeEventListener("message", onMessage);
          clearTimeout(safetyTimer);
          
          hidden.className = "viewer-frame active";
          active.className = "viewer-frame hidden";
          currentFrame = (currentFrame === "A" ? "B" : "A");
          
          // 화면이 성공적으로 전환된 후 지정된 초만큼 대기하고 프레임 완료(resolve) 처리
          setTimeout(resolve, displayDuration);
        }
      });
    }

    // async/await 기반의 직관적인 무한 순환 스케줄러 (타이머 꼬임 원천 차단)
    async function startRotation() {
      while (true) {
        if (apartmentList.length === 0) {
          await new Promise(r => setTimeout(r, 2000)); // 리스트 없으면 2초 대기 후 재체크
          continue;
        }

        const apt = apartmentList[currentIndex];
        const skin = currentIndex % 6;

        // 1단계: 이미지 페이지 표출
        const imgUrl = IMAGE_PAGE + "?apt=" + encodeURIComponent(apt) + "&skin=" + skin;
        await changeFrame(imgUrl, getImgTime());

        // 2단계: 대시보드 페이지 표출
        const boardUrl = BOARD_PAGE + "?apt=" + encodeURIComponent(apt) + "&skin=" + skin;
        await changeFrame(boardUrl, getBrdTime());

        // 3단계: 특정 스킨 고정이미지 분기 처리
        if (skin === 2 || skin === 5) {
          const fileName = (skin === 2 ? '동원부동산_방문환영.png' : '동원초중_부동산.png');
          const folder = isMobile() ? "./fixed_mob/" : "./fixed/";
          const specialPageUrl = "viewer_image.html?img=" + encodeURIComponent(folder + fileName);
          await changeFrame(specialPageUrl, getBrdTime());
        }

        // 인덱스 증가 및 순환
        currentIndex = (currentIndex + 1) % apartmentList.length;
      }
    }

    async function loadList() {
      try {
        const res = await fetch(csvUrl + "&t=" + Date.now());
        const text = await res.text();
        parseCSV(text);
        
        // 최초 로드 성공 시 구동 시작
        if (!isInitialized && apartmentList.length > 0) {
          isInitialized = true;
          
          const firstUrl = IMAGE_PAGE + "?apt=" + encodeURIComponent(apartmentList[0]) + "&skin=0";
          const firstViewer = document.getElementById("viewerA");

          firstViewer.onload = () => {
            firstViewer.onload = null;
            firstViewer.className = "viewer-frame active";

            setTimeout(() => {
              document.getElementById("loading-screen").style.display = "none";
              startRotation(); // 순환 스케줄러 기동
            }, 300);
          };
          firstViewer.src = firstUrl;
        }
      } catch(e) { 
        console.error("CSV 업데이트 로드 오류:", e);
        // 네트워크가 끊겨도 기존 대시보드는 멈추지 않고 계속 작동합니다.
      }
    }

    function updateClock() {
      const clock = document.getElementById("loading-clock");
      if (clock) {
        clock.innerText = new Date().toLocaleString("ko-KR");
      }
    }

    // 실행 및 주기 설정
    updateClock();
    setInterval(updateClock, 1000);

    loadList();
    setInterval(loadList, 3600000); // 1시간마다 데이터 갱신
  </script>
</body>
</html>
