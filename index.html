<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>아파트 실거래 전광판</title>
<style>
/* 기본 스킨 및 단지별 색상 변수 */
:root{--bg:#101820;--panel:#182631;--panel2:#203341;--line:rgba(255,255,255,.13);--text:#f4f7f9;--muted:#a9bac5;--accent:#d9ef83;--panel-gradient:linear-gradient(145deg,#1a2a35,#111d26);--image-bg:#17242d;--apt-shadow:rgba(217,239,131,.16);--card-border:rgba(255,255,255,.15);--title-color:#ffe18a;--title-border:#e7bd61;--area-color:#f2ffd0;--area-bg:rgba(217,239,131,.13);--area-border:rgba(217,239,131,.5)}
/* ① 네이비 골드 */
body[data-skin="navy"]{--bg:#0b1422;--panel:#14243a;--panel2:#203550;--line:rgba(180,202,230,.22);--muted:#b2c2d5;--accent:#e5c77b;--panel-gradient:linear-gradient(145deg,#1b304b,#101c2d);--image-bg:#172a40;--apt-shadow:rgba(229,199,123,.2);--card-border:rgba(190,207,230,.2);--title-color:#f5d995;--title-border:#c9a85d;--area-color:#f9e8b5;--area-bg:rgba(201,168,93,.15);--area-border:rgba(201,168,93,.5)}
/* ② 에메랄드 그린 */
body[data-skin="emerald"]{--bg:#0c1b19;--panel:#15302b;--panel2:#20443b;--line:rgba(174,218,194,.2);--muted:#b4cfc2;--accent:#9bd3b1;--panel-gradient:linear-gradient(145deg,#1b4036,#102720);--image-bg:#17382f;--apt-shadow:rgba(155,211,177,.2);--card-border:rgba(174,218,194,.2);--title-color:#e5d6a0;--title-border:#bba66c;--area-color:#d9f1df;--area-bg:rgba(130,190,153,.14);--area-border:rgba(155,211,177,.48)}
/* ③ 차콜 실버 */
body[data-skin="charcoal"]{--bg:#17191d;--panel:#252a30;--panel2:#343b43;--line:rgba(220,228,235,.17);--muted:#c0c8d0;--accent:#d5dce3;--panel-gradient:linear-gradient(145deg,#343b43,#20252b);--image-bg:#30363d;--apt-shadow:rgba(213,220,227,.16);--card-border:rgba(220,228,235,.18);--title-color:#e8edf2;--title-border:#aeb9c4;--area-color:#eef2f5;--area-bg:rgba(190,202,213,.13);--area-border:rgba(190,202,213,.45)}
/* ④ 버건디 골드 */
body[data-skin="burgundy"]{--bg:#211116;--panel:#351c25;--panel2:#4a2934;--line:rgba(238,194,199,.18);--muted:#d5b9c0;--accent:#e4b2a9;--panel-gradient:linear-gradient(145deg,#512b38,#2b1820);--image-bg:#43232e;--apt-shadow:rgba(228,178,169,.18);--card-border:rgba(238,194,199,.18);--title-color:#f0d09a;--title-border:#c49a62;--area-color:#f6dfc5;--area-bg:rgba(196,154,98,.14);--area-border:rgba(196,154,98,.48)}
/* ⑤ 딥 틸 블루 */
body[data-skin="teal"]{--bg:#0d1b22;--panel:#17313b;--panel2:#214451;--line:rgba(174,216,224,.2);--muted:#b4cbd0;--accent:#8ed0d0;--panel-gradient:linear-gradient(145deg,#1e4652,#102832);--image-bg:#193b45;--apt-shadow:rgba(142,208,208,.18);--card-border:rgba(174,216,224,.2);--title-color:#d8eeee;--title-border:#79b7bd;--area-color:#d9f3f2;--area-bg:rgba(121,183,189,.14);--area-border:rgba(121,183,189,.48)}
/* ⑥ 브론즈 브라운 */
body[data-skin="bronze"]{--bg:#1e1812;--panel:#30251b;--panel2:#443629;--line:rgba(225,204,174,.19);--muted:#cdbda8;--accent:#d9b98b;--panel-gradient:linear-gradient(145deg,#493829,#261e17);--image-bg:#3b2d21;--apt-shadow:rgba(217,185,139,.18);--card-border:rgba(225,204,174,.19);--title-color:#f0d4a7;--title-border:#b98d58;--area-color:#f2dfc2;--area-bg:rgba(185,141,88,.14);--area-border:rgba(185,141,88,.48)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%}
body{background:var(--bg);color:var(--text);font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;overflow:hidden}
#app{width:100vw;height:100vh;min-height:420px;display:grid;grid-template-columns:minmax(300px,42%) 1fr;gap:18px;padding:18px}
.left,.right{min-width:0;min-height:0;border:1px solid var(--line);border-radius:18px;background:var(--panel);overflow:hidden}
.left{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px}
.apt-name{width:100%;text-align:center;font-size:clamp(24px,3vw,46px);font-weight:800;letter-spacing:-1.5px;margin:0 0 18px;color:var(--accent);text-shadow:0 2px 14px var(--apt-shadow);word-break:keep-all}
.apt-image-wrap{width:100%;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:var(--image-bg);border-radius:12px;overflow:hidden}
#aptImage{display:block;width:100%;height:100%;object-fit:cover;object-position:center}
.image-fallback{color:#24323b;text-align:center;padding:20px;font-size:18px;line-height:1.6;white-space:pre-line}
.right{display:flex;flex-direction:column;padding:20px;background:var(--panel-gradient)}
.right-head{display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:1px solid var(--line);padding:0 2px 15px;margin-bottom:16px;min-width:0}
.right-title{font-size:clamp(22px,2.15vw,34px);font-weight:700;letter-spacing:-1px;line-height:1.2;min-width:0;word-break:keep-all}
.title-apt{display:inline-block;color:var(--title-color);font-weight:900;text-shadow:0 1px 12px var(--apt-shadow);padding:3px 9px 5px;margin-right:5px;border-left:4px solid var(--title-border);background:linear-gradient(90deg,var(--area-bg),transparent);border-radius:4px}
.title-caption{color:#f4f7f9;font-weight:700}
.area-label{flex:0 0 auto;color:var(--area-color);background:var(--area-bg);border:1px solid var(--area-border);border-radius:10px;padding:9px 14px;font-size:clamp(17px,1.55vw,24px);white-space:nowrap;font-weight:900;letter-spacing:-.3px;text-shadow:0 1px 8px rgba(217,239,131,.18)}
#tradeList{min-height:0;flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:clamp(5px,0.8vh,12px);overflow:hidden}
.trade-card{min-width:0;min-height:0;position:relative;border:1px solid var(--card-border);border-radius:14px;background:var(--panel2);padding:clamp(5px,1.25vh,15px) clamp(7px,1vw,17px);display:flex;flex-direction:column;justify-content:center;gap:clamp(2px,.7vh,9px);overflow:hidden;box-shadow:0 5px 18px rgba(0,0,0,.12)}
.trade-card.highest{border:3px solid #ffd45c;background:linear-gradient(135deg,#59451b,#332b20 72%);box-shadow:0 0 0 2px rgba(255,212,92,.18),0 0 24px rgba(255,190,55,.32)}
.trade-card.highest .trade-price{color:#ffe27a;font-size:clamp(20px,3.4vh,43px);text-shadow:0 0 12px rgba(255,210,80,.25)}
.highest-badge{align-self:flex-start;background:#ffd45c;color:#33250a;font-size:clamp(10px,1.35vh,15px);font-weight:900;letter-spacing:.5px;padding:clamp(2px,.45vh,4px) clamp(6px,.8vw,11px);border-radius:999px;line-height:1.15}
.trade-card.highest .trade-date{color:#ffe8a6}
.trade-date{color:var(--muted);font-size:clamp(11px,1.65vh,18px);font-weight:600;line-height:1.15;overflow-wrap:anywhere}
.trade-price{color:var(--accent);font-size:clamp(18px,3.1vh,39px);font-weight:900;letter-spacing:-1px;line-height:1.08;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.trade-meta{display:flex;flex-wrap:wrap;gap:clamp(2px,.45vh,8px) clamp(5px,.8vw,15px);color:#e2eaf0;font-size:clamp(11px,1.55vh,17px);line-height:1.15;min-width:0}
.empty{grid-column:1/-1;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:clamp(20px,2vw,30px);text-align:center;border:1px dashed var(--line);border-radius:14px;padding:18px}
#status{position:fixed;left:22px;bottom:8px;color:rgba(255,255,255,.5);font-size:11px;z-index:5}
#loadingScreen,#welcomeScreen{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#263d4b 0%,#101820 72%);color:#f4f7f9}
.loading-content{text-align:center;padding:32px 24px;width:min(90vw,560px)}
.loading-spinner{width:58px;height:58px;margin:0 auto 28px;border:5px solid rgba(255,255,255,.18);border-top-color:#d9ef83;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-message{font-size:clamp(19px,2.2vw,28px);font-weight:700;line-height:1.5;margin-bottom:30px;word-break:keep-all}
.loading-brand{font-size:clamp(27px,3vw,40px);font-weight:900;color:#d9ef83;letter-spacing:-1px;margin-bottom:9px}
.loading-phone{font-size:clamp(22px,2.5vw,32px);font-weight:800;letter-spacing:1px}
#welcomeScreen{background:#101820}
#welcomeScreen[hidden]{display:none}
#welcomeImage{display:block;width:100%;height:100%;object-fit:contain;object-position:center}
/* TV 및 데스크톱: 거래 박스 높이에 맞춰 글자와 여백을 자동 축소 */
@media(min-width:761px){
  #tradeList{grid-template-rows:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:clamp(4px,.65vh,10px)}
  .trade-card{padding:clamp(4px,1.05vh,12px) clamp(6px,.8vw,14px);gap:clamp(2px,.55vh,7px)}
  .trade-date{font-size:clamp(11px,1.55vh,17px)}
  .trade-price{font-size:clamp(18px,2.9vh,36px)}
  .trade-card.highest .trade-price{font-size:clamp(20px,3.15vh,40px)}
  .trade-meta{font-size:clamp(11px,1.45vh,16px)}
  .highest-badge{font-size:clamp(10px,1.25vh,14px)}
}
@media(max-width:760px){
  body{overflow:hidden}
  #app{width:100%;height:100vh;height:100dvh;min-height:0;grid-template-columns:1fr;grid-template-rows:25% minmax(0,1fr);gap:8px;padding:8px}
  .left{padding:8px}
  .apt-name{margin:0 0 6px;font-size:clamp(17px,5vw,23px);letter-spacing:-.8px}
  .right{padding:9px}
  .right-head{padding:0 1px 7px;margin-bottom:7px;gap:5px}
  .right-title{font-size:clamp(14px,3.8vw,19px);letter-spacing:-.6px}
  .title-apt{padding:2px 5px 3px;margin-right:3px;border-left-width:3px}
  .area-label{font-size:clamp(12px,3.2vw,16px);padding:5px 7px;border-radius:7px}
  /* 모바일에서도 2열 x 4행으로 배치해 최근 거래 8건을 한 화면에 표시 */
  #tradeList{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:6px;overflow:hidden}
  .trade-card{padding:5px 7px;gap:3px;border-radius:9px;justify-content:center}
  .trade-date{font-size:clamp(10px,2.8vw,13px)}
  .trade-price{font-size:clamp(16px,4.7vw,23px);letter-spacing:-.7px;line-height:1.08}
  .trade-meta{font-size:clamp(10px,2.8vw,13px);gap:3px 7px}
  .highest-badge{font-size:clamp(9px,2.4vw,11px);padding:2px 7px}
  .trade-card.highest{border-width:2px}
  .trade-card.highest .trade-price{font-size:clamp(17px,5vw,24px)}
}
@media(max-width:380px){
  #app{grid-template-rows:22% minmax(0,1fr);gap:6px;padding:6px}
  .right{padding:7px}
  .right-head{margin-bottom:5px;padding-bottom:5px}
  #tradeList{gap:4px}
  .trade-card{padding:4px 5px;gap:2px}
  .trade-price{font-size:clamp(15px,4.5vw,19px)}
  .trade-card.highest .trade-price{font-size:clamp(16px,4.8vw,20px)}
}
@media(max-height:650px) and (max-width:760px){
  #app{grid-template-rows:19% minmax(0,1fr)}
  .apt-name{font-size:16px;margin-bottom:4px}
  .right-head{padding-bottom:4px;margin-bottom:4px}
  .trade-card{padding:3px 5px;gap:1px}
  .trade-date,.trade-meta{font-size:10px}
  .trade-price{font-size:16px}
  .trade-card.highest .trade-price{font-size:17px}
  .highest-badge{font-size:9px;padding:1px 5px}
}
</style>
</head>
<body>
<main id="app">
<section class="left">
<h1 class="apt-name" id="aptName">전광판 데이터를 불러오는 중입니다.</h1>
<div class="apt-image-wrap">
<img id="aptImage" alt="아파트 이미지" hidden>
<div class="image-fallback" id="imageFallback" hidden></div>
</div>
</section>
<section class="right">
<header class="right-head"><div class="right-title" id="rightTitle">최근 아파트 실거래</div><div class="area-label" id="areaLabel"></div></header>
<div id="tradeList"><div class="empty">구글시트 데이터를 불러오는 중입니다.</div></div>
</section>
</main>
<div id="status">초기화 중</div>
<div id="loadingScreen" role="status" aria-live="polite">
  <div class="loading-content">
    <div class="loading-spinner"></div>
    <div class="loading-message">아파트 실거래 정보를 불러오고 있습니다.<br>잠시만 기다려 주세요.</div>
    <div class="loading-brand">동원부동산</div>
    <div class="loading-phone">010-2650-3485</div>
  </div>
</div>
<div id="welcomeScreen" hidden aria-label="동원부동산 방문 환영">
  <img id="welcomeImage" src="./fixed/동원부동산_방문환영.png" alt="동원부동산 방문을 환영합니다">
</div>
<script>
/* 구글 스프레드시트에서 웹에 게시한 CSV 주소 */
const OUTPUT_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQgyqshQINttrum-zFjvCyMZ4ZFpKoPQxN8a_XNdVK7TcRXl2nOgTa1t385cnCDWKg0Nbr5dU2y9Tan/pub?gid=1318467463&single=true&output=csv";
const META_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQgyqshQINttrum-zFjvCyMZ4ZFpKoPQxN8a_XNdVK7TcRXl2nOgTa1t385cnCDWKg0Nbr5dU2y9Tan/pub?gid=0&single=true&output=csv";

/*
 * 이미지 파일을 웹호스팅의 index.html과 같은 위치에 image 폴더를 만들어 올리세요.
 * 예: /board/index.html, /board/image/중랑숲금호어울림.jpg
 */
const IMAGE_BASE_PATH = "./image/";
const DEFAULT_ROTATE_SECONDS = 5; // 전광판_주기 값이 비어 있거나 잘못된 경우 기본 5초

let boardGroups = [];
let currentIndex = 0;
let rotateTimer = null;
let requestTimer = null;
let showingWelcome = false;
let imageRenderToken = 0;
const imagePreloadCache = new Map();

function setStatus(s){document.getElementById("status").textContent=s}
function hideLoading(){document.getElementById("loadingScreen").style.display="none"}
function showWelcome(){
  showingWelcome=true;
  document.getElementById("app").style.visibility="hidden";
  document.getElementById("welcomeScreen").hidden=false;
  setStatus("동원부동산 방문 환영 화면 · 5초");
}
function hideWelcome(){
  showingWelcome=false;
  document.getElementById("welcomeScreen").hidden=true;
  document.getElementById("app").style.visibility="visible";
}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function imageUrl(filename){
  const n=String(filename||"").trim();
  if(!n)return "";
  if(/^(https?:)?\/\//i.test(n)||n.startsWith("data:"))return n;
  return IMAGE_BASE_PATH + n.split("/").map(encodeURIComponent).join("/");
}

function preloadImage(src){
  if(!src)return Promise.reject(new Error("이미지 경로가 없습니다."));
  if(imagePreloadCache.has(src))return imagePreloadCache.get(src);
  const promise=new Promise((resolve,reject)=>{
    const image=new Image();
    image.onload=()=>resolve(src);
    image.onerror=()=>reject(new Error("이미지를 불러오지 못했습니다."));
    image.src=src;
  });
  imagePreloadCache.set(src,promise);
  return promise;
}

function preloadUpcomingImages(){
  if(!boardGroups.length)return;
  // 다음 두 단지의 이미지를 미리 읽어 화면 전환 지연을 줄입니다.
  for(let offset=1;offset<=Math.min(2,boardGroups.length-1);offset++){
    const next=boardGroups[(currentIndex+offset)%boardGroups.length];
    const src=imageUrl(next.imageFile);
    if(src)preloadImage(src).catch(()=>{});
  }
}

function renderGroup(g){
  // 현재 단지의 스킨을 body에 적용합니다. 최고가 박스는 별도 금색 스타일을 유지합니다.
  document.body.dataset.skin=g.skin||"navy";
  document.getElementById("aptName").textContent=g.name;
  document.getElementById("rightTitle").innerHTML=`<span class="title-apt">${esc(g.name)}</span><span class="title-caption">최근 아파트 실거래</span>`;
  document.getElementById("areaLabel").textContent="전용면적 "+g.area+"㎡";

  const img=document.getElementById("aptImage");
  const fb=document.getElementById("imageFallback");
  const src=imageUrl(g.imageFile);
  const renderToken=++imageRenderToken;

  if(src){
    // 로딩 문구를 표시하지 않고, 새 이미지가 준비될 때까지 기존 이미지를 유지합니다.
    fb.hidden=true;
    preloadImage(src).then(()=>{
      if(renderToken!==imageRenderToken)return;
      img.src=src;
      img.hidden=false;
      fb.hidden=true;
    }).catch(()=>{
      if(renderToken!==imageRenderToken)return;
      img.hidden=true;
      fb.hidden=false;
      fb.textContent="이미지를 표시할 수 없습니다.";
    });
  }else{
    img.hidden=true;
    img.removeAttribute("src");
    fb.hidden=false;
    fb.textContent="등록된 이미지 파일명이 없습니다.";
  }

  preloadUpcomingImages();

  const list=document.getElementById("tradeList");
  if(!g.trades || !g.trades.length){
    list.innerHTML='<div class="empty">해당 면적의 실거래 내역이 없습니다.</div>';
    return;
  }
  const visibleTrades=g.trades.slice(0,8);
  const maxPrice=Math.max(...visibleTrades.map(t=>t.priceValue).filter(v=>v!==null));
  list.innerHTML=visibleTrades.map(t=>{
    const isHighest=t.priceValue!==null && t.priceValue===maxPrice;
    return `<article class="trade-card${isHighest?" highest":""}">
      ${isHighest?'<div class="highest-badge">최고가</div>':""}
      <div class="trade-date">${esc(t.date)}</div>
      <div class="trade-price">${esc(t.price)}</div>
      <div class="trade-meta"><span>${esc(t.floor)}층</span><span>전용 ${esc(t.area)}㎡</span></div>
    </article>`;
  }).join("");
}

function getGroupRotateMs(group){
  const seconds=Number(group?.rotateSeconds);
  return Number.isFinite(seconds)&&seconds>0?seconds*1000:DEFAULT_ROTATE_SECONDS*1000;
}

function scheduleNextRotation(){
  if(rotateTimer)clearTimeout(rotateTimer);

  // 환영 화면은 기존과 동일하게 5초간 표시합니다.
  const delay=showingWelcome?DEFAULT_ROTATE_SECONDS*1000:getGroupRotateMs(boardGroups[currentIndex]);

  rotateTimer=setTimeout(()=>{
    if(showingWelcome){
      currentIndex=0;
      hideWelcome();
      renderGroup(boardGroups[currentIndex]);
      setStatus(`${currentIndex+1} / ${boardGroups.length} 단지 · ${boardGroups[currentIndex].rotateSeconds}초 후 전환`);
      scheduleNextRotation();
      return;
    }

    if(currentIndex===boardGroups.length-1){
      showWelcome();
      scheduleNextRotation();
      return;
    }

    currentIndex++;
    renderGroup(boardGroups[currentIndex]);
    setStatus(`${currentIndex+1} / ${boardGroups.length} 단지 · ${boardGroups[currentIndex].rotateSeconds}초 후 전환`);
    scheduleNextRotation();
  },delay);
}

function startRotation(){
  hideLoading();
  if(rotateTimer)clearTimeout(rotateTimer);
  if(!boardGroups.length){
    document.getElementById("aptName").textContent="표시할 단지가 없습니다.";
    document.getElementById("tradeList").innerHTML='<div class="empty">단지명meta 탭의 전광판_표시여부와 나의_단지명을 확인해 주세요.</div>';
    setStatus("표시 대상 단지 없음");
    return;
  }
  hideWelcome();
  renderGroup(boardGroups[currentIndex]);
  setStatus(`${currentIndex+1} / ${boardGroups.length} 단지 · ${boardGroups[currentIndex].rotateSeconds}초 후 전환`);
  scheduleNextRotation();
}

// 화면을 터치하거나 마우스로 클릭하면 다음 단지로 즉시 이동합니다.
// 터치도 브라우저의 click 이벤트로 처리하므로 touch 이벤트를 별도로 등록하지 않습니다.
function advanceGroupByUserInput(){
  if(!boardGroups.length)return;

  // 환영 화면에서 입력하면 첫 번째 단지로 돌아갑니다.
  if(showingWelcome){
    currentIndex=0;
    hideWelcome();
  }else if(currentIndex===boardGroups.length-1){
    // 마지막 단지에서 입력하면 기존 순환 흐름과 같이 환영 화면을 표시합니다.
    showWelcome();
    scheduleNextRotation();
    return;
  }else{
    currentIndex++;
  }

  renderGroup(boardGroups[currentIndex]);
  setStatus(`${currentIndex+1} / ${boardGroups.length} 단지 · ${boardGroups[currentIndex].rotateSeconds}초 후 전환 (터치/클릭 가능)`);
  // 수동으로 넘긴 시점부터 해당 단지의 표시 주기를 다시 계산합니다.
  scheduleNextRotation();
}

/* 모바일에서 위로 스와이프하면 이전 단지로 이동합니다. */
function goToPreviousGroupBySwipe(){
  if(!boardGroups.length)return;

  if(showingWelcome){
    // 고정 환영 화면에서 이전 동작을 하면 마지막 단지로 이동합니다.
    currentIndex=boardGroups.length-1;
    hideWelcome();
    renderGroup(boardGroups[currentIndex]);
    setStatus(`${currentIndex+1} / ${boardGroups.length} 단지 · ${boardGroups[currentIndex].rotateSeconds}초 후 전환 (이전 단지)`);
    scheduleNextRotation();
    return;
  }

  if(currentIndex===0){
    // 첫 번째 단지에서 위로 스와이프하면 마지막 고정 환영 이미지를 표시합니다.
    showWelcome();
    scheduleNextRotation();
    return;
  }

  currentIndex--;
  renderGroup(boardGroups[currentIndex]);
  setStatus(`${currentIndex+1} / ${boardGroups.length} 단지 · ${boardGroups[currentIndex].rotateSeconds}초 후 전환 (이전 단지)`);
  scheduleNextRotation();
}

// PC 마우스 클릭 및 모바일 탭으로 다음 단지로 이동합니다.
// 터치 스와이프 직후 브라우저가 발생시키는 합성 click은 중복 전환되지 않도록 무시합니다.
let suppressClickUntil=0;
document.addEventListener("click",(event)=>{
  if(Date.now()<suppressClickUntil)return;
  // PC 더블클릭의 두 번째 click(detail=2)은 무시하여 한 번만 전환합니다.
  if(event.detail>1)return;
  advanceGroupByUserInput();
});

// PC 마우스 휠: 위·아래 어느 방향이든 한 번의 스크롤 동작당 한 단지만 이동합니다.
// 휠 이벤트가 연속 발생하는 것을 방지하기 위해 짧은 쿨다운을 둡니다.
let lastWheelActionAt=0;
document.addEventListener("wheel",()=>{
  const now=Date.now();
  if(now-lastWheelActionAt<650)return;
  lastWheelActionAt=now;
  advanceGroupByUserInput();
},{passive:true});

// 모바일 스와이프 방향에 따라 단지를 이동합니다.
// 위쪽·왼쪽·오른쪽 스와이프: 다음 단지 / 아래쪽 스와이프: 이전 단지
let touchStartX=0;
let touchStartY=0;
let touchStartAt=0;
document.addEventListener("touchstart",(event)=>{
  if(!event.touches||event.touches.length!==1)return;
  touchStartX=event.touches[0].clientX;
  touchStartY=event.touches[0].clientY;
  touchStartAt=Date.now();
},{passive:true});

document.addEventListener("touchend",(event)=>{
  if(!event.changedTouches||event.changedTouches.length!==1)return;

  const touch=event.changedTouches[0];
  const deltaX=touch.clientX-touchStartX;
  const deltaY=touch.clientY-touchStartY;
  const elapsed=Date.now()-touchStartAt;

  const absX=Math.abs(deltaX);
  const absY=Math.abs(deltaY);
  const distance=Math.hypot(deltaX,deltaY);

  // 45px 이상 이동하고 1.2초 이내에 끝난 스와이프만 인정합니다.
  if(distance>=45 && elapsed<1200){
    suppressClickUntil=Date.now()+700;

    // 요청한 방향별 동작: 위·왼쪽·오른쪽은 다음 단지, 아래는 이전 단지
    if(absY>absX*1.2){
      if(deltaY<0){
        advanceGroupByUserInput(); // 위로: 다음 단지
      }else{
        goToPreviousGroupBySwipe(); // 아래로: 이전 단지
      }
    }else{
      advanceGroupByUserInput(); // 왼쪽·오른쪽: 다음 단지
    }
  }
},{passive:true});

function showLoadError(message){
  hideLoading();
  setStatus("데이터 로딩 오류");
  document.getElementById("tradeList").innerHTML=
    '<div class="empty">'+esc(message)+'</div>';
}

/* CSV 파싱: 쉼표, 큰따옴표, 셀 내부 줄바꿈 처리 */
function parseCSV(text){
  const rows=[];let row=[];let cell="";let quoted=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(quoted){
      if(c==='"' && text[i+1]==='"'){cell+='"';i++}
      else if(c==='"')quoted=false;
      else cell+=c;
    }else{
      if(c==='"')quoted=true;
      else if(c===','){row.push(cell);cell=""}
      else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell=""}
      else if(c!=='\r')cell+=c;
    }
  }
  if(cell!==""||row.length){row.push(cell);rows.push(row)}
  return rows.filter(r=>r.some(v=>String(v).trim()!==""));
}
function headerMap(headers){
  const m={};headers.forEach((h,i)=>m[String(h||"").trim().replace(/\s+/g,"")]=i);return m;
}
function col(map,name,sheet){
  const k=String(name).replace(/\s+/g,"");
  if(!(k in map))throw new Error("'"+sheet+"' CSV에서 '"+name+"' 헤더를 찾을 수 없습니다.");
  return map[k];
}
function num(v){const n=Number(String(v??"").replace(/,/g,"").replace(/[^\d.-]/g,""));return Number.isFinite(n)?n:null}
function intArea(v){const n=num(v);return n===null?null:Math.trunc(n)}
function keyOf(apt,area){return String(apt).trim()+"||"+String(Math.trunc(Number(area)))}
function maxNum(a,b){const n=num(b);return n===null?a:(a===null||n>a?n:a)}
function maxText(a,b){const v=String(b??"").trim();return !v?a:( !a||v.localeCompare(String(a),"ko")>0?v:a)}
function normalizeSkin(value){
  const v=String(value||"").trim().toLowerCase().replace(/[\s_-]/g,"");
  const aliases={
    navy:"navy",네이비:"navy",네이비골드:"navy",navygold:"navy",
    emerald:"emerald",green:"emerald",에메랄드:"emerald",에메랄드그린:"emerald",
    charcoal:"charcoal",gray:"charcoal",grey:"charcoal",차콜:"charcoal",차콜실버:"charcoal",
    burgundy:"burgundy",버건디:"burgundy",버건디골드:"burgundy",
    teal:"teal",딥틸:"teal",틸블루:"teal",딥틸블루:"teal",
    bronze:"bronze",브론즈:"bronze",브론즈브라운:"bronze",brown:"bronze"
  };
  return aliases[v]||"navy";
}
function cleanPart(v){const n=num(v);return n===null?"":String(Math.trunc(n))}
function formatDate(y,m,d){return y&&m&&d?y.padStart(4,"0")+"."+m.padStart(2,"0")+"."+d.padStart(2,"0"):""}
function formatPrice(v,raw){
  const n=num(v);if(n===null)return String(raw||"");
  return n>=10000?Math.floor(n/10000)+"억"+(n%10000?" "+(n%10000).toLocaleString("ko-KR"):"") : n.toLocaleString("ko-KR")+"만원";
}
async function fetchCSV(url,label){
  const response=await fetch(url,{cache:"no-store"});
  if(!response.ok)throw new Error(label+" CSV를 불러오지 못했습니다. (HTTP "+response.status+")");
  const text=await response.text();
  if(text.trim().startsWith("<!DOCTYPE")||text.includes("google.com/accounts"))throw new Error(label+" 시트가 CSV로 공개되어 있는지 확인해 주세요.");
  return parseCSV(text);
}
function buildGroups(metaRows,outputRows){
  if(metaRows.length<2||outputRows.length<2)return [];
  const mh=headerMap(metaRows[0]),oh=headerMap(outputRows[0]);
  const mi={visible:col(mh,"전광판_표시여부","단지명meta"),apt:col(mh,"나의_단지명","단지명meta"),area:col(mh,"전광판_표시면적(약식)","단지명meta"),image:col(mh,"전광판_이미지파일명","단지명meta"),skin:col(mh,"전광판_스킨","단지명meta"),rotate:col(mh,"전광판_주기","단지명meta")};
  const oi={apt:col(oh,"단지명","출력용"),area:col(oh,"전용면적","출력용"),year:col(oh,"계약년도","출력용"),month:col(oh,"계약월","출력용"),day:col(oh,"계약일","출력용"),price:col(oh,"거래금액(만원)","출력용"),floor:col(oh,"층","출력용")};
  const meta=new Map();
  for(let r=1;r<metaRows.length;r++){
    const row=metaRows[r];
    const apt=String(row[mi.apt]||"").trim();
    const visible=String(row[mi.visible]||"").trim();
    const area=intArea(row[mi.area]);
    if(!visible||!apt||area===null)continue;

    // '나의_단지명'과 '전광판_표시면적(약식)' 조합으로 그룹핑합니다.
    // 같은 단지라도 면적이 다르면 별도 전광판 화면으로 표시합니다.
    const groupKey=keyOf(apt,area);
    if(!meta.has(groupKey)){
      meta.set(groupKey,{
        name:apt,
        area,
        imageFile:"",
        skin:"",
        rotateSeconds:null
      });
    }
    const g=meta.get(groupKey);

    // 나머지 컬럼은 동일 단지·동일 면적 그룹 안에서 최대값을 적용합니다.
    g.imageFile=maxText(g.imageFile,row[mi.image]);
    g.skin=maxText(g.skin,row[mi.skin]);
    g.rotateSeconds=maxNum(g.rotateSeconds,row[mi.rotate]);
  }
  const trades=new Map();
  for(let r=1;r<outputRows.length;r++){
    const row=outputRows[r],apt=String(row[oi.apt]||"").trim(),area=intArea(row[oi.area]);
    if(!apt||area===null)continue;
    const y=cleanPart(row[oi.year]),m=cleanPart(row[oi.month]),d=cleanPart(row[oi.day]);
    const price=num(row[oi.price]);
    const t={date:formatDate(y,m,d),dateSort:Number(y||0)*10000+Number(m||0)*100+Number(d||0),price:formatPrice(row[oi.price],row[oi.price]),priceValue:price,floor:String(row[oi.floor]||"").trim(),area};
    const k=keyOf(apt,area);if(!trades.has(k))trades.set(k,[]);trades.get(k).push(t);
  }
  const groups=[];
  meta.forEach(g=>{
    groups.push({
      name:g.name,
      area:g.area,
      imageFile:g.imageFile,
      skin:normalizeSkin(g.skin),
      rotateSeconds:g.rotateSeconds!==null&&g.rotateSeconds>0?g.rotateSeconds:DEFAULT_ROTATE_SECONDS,
      trades:(trades.get(keyOf(g.name,g.area))||[]).slice().sort((a,b)=>b.dateSort-a.dateSort)
    });
  });
  return groups;
}
async function loadBoard(){
  try{
    setStatus("구글시트 데이터 연결 중");
    const [metaRows,outputRows]=await Promise.all([fetchCSV(META_CSV_URL,"단지명meta"),fetchCSV(OUTPUT_CSV_URL,"출력용")]);
    boardGroups=buildGroups(metaRows,outputRows);currentIndex=0;startRotation();
  }catch(err){showLoadError(err.message||String(err));}
}
loadBoard();
</script>
